# Pipeline de integración continua.
#
# Tres etapas encadenadas — typecheck → test → build — de forma que si los
# tipos no compilan no se gastan minutos en correr los tests, y si los tests
# fallan no se construye el bundle. El primer trabajo que falle corta la cadena.
name: CI

# Cuándo se dispara. `master` es la rama por defecto de este repo: si aquí
# pusiera `main` el pipeline no se ejecutaría nunca.
on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

# Permisos del token que GitHub inyecta en cada job. Solo lectura: este
# pipeline no escribe en el repo, no publica releases ni despliega nada.
permissions:
  contents: read

# Si llegan dos pushes seguidos a la misma rama, cancela el run anterior en
# vez de dejar los dos compitiendo. Ahorra minutos y evita ver el resultado
# de un commit que ya quedó obsoleto.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  typecheck:
    name: Type-check
    runs-on: ubuntu-latest
    steps:
      # Baja el código del repo a la máquina del runner.
      - uses: actions/checkout@v4

      # Instala Node. `cache: npm` guarda ~/.npm entre ejecuciones usando el
      # package-lock.json como clave, así que las dependencias se descargan
      # una vez y los runs siguientes son bastante más rápidos.
      - uses: actions/setup-node@v4
        with:
          node-version: '20.x'
          cache: npm

      # `npm ci` en vez de `npm install`: instala exactamente lo que fija el
      # lockfile y falla si package.json y package-lock.json no concuerdan.
      # `install` puede actualizar versiones por su cuenta, y entonces el CI
      # deja de probar lo mismo que tienes en local.
      - name: Install dependencies
        run: npm ci

      # `tsc -b`, no `tsc --noEmit`: el tsconfig.json raíz de este repo es de
      # tipo solución ("files": [] y solo referencias), así que --noEmit no
      # comprueba ningún fichero y siempre pasa.
      - name: Type-check
        run: npx tsc -b

  test:
    name: Test
    # Solo arranca si `typecheck` terminó bien. Sin esta línea los tres jobs
    # correrían en paralelo y verías fallar los tests por un error de tipos.
    needs: typecheck
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20.x'
          cache: npm

      - name: Install dependencies
        run: npm ci

      # `npm test` = `vitest run`: una pasada y termina. Sin `run`, Vitest se
      # queda en modo watch y el job colgaría hasta agotar el timeout.
      - name: Run tests
        run: npm test

  build:
    name: Build
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20.x'
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build

      # Guarda el resultado del build como artefacto descargable desde la
      # página del run. No despliega nada: solo deja el bundle a mano para
      # inspeccionarlo, y es el punto de enganche natural el día que se añada
      # un job de deploy. Se puede borrar sin afectar al resto.
      - name: Upload build output
        uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/
          retention-days: 7

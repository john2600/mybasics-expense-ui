# Continuous integration pipeline.
#
# Three chained stages — typecheck → test → build — so a type error does not
# spend minutes running tests, and failing tests do not build a bundle. The
# first job that fails breaks the chain.
name: CI

# When this runs. `master` is this repo's default branch: putting `main` here
# would mean the pipeline never runs.
on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

# Permissions for the token GitHub injects into every job. Read-only: this
# pipeline does not write to the repo, publish releases or deploy anything.
permissions:
  contents: read

# If two pushes land on the same branch back to back, cancel the earlier run
# instead of leaving both competing. Saves minutes and avoids reading the
# result of a commit that is already outdated.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  typecheck:
    name: Type-check
    runs-on: ubuntu-latest
    steps:
      # Pull the repository onto the runner.
      - uses: actions/checkout@v4

      # Install Node. `cache: npm` keeps ~/.npm between runs keyed on
      # package-lock.json, so dependencies are downloaded once and later runs
      # are noticeably faster.
      - uses: actions/setup-node@v4
        with:
          node-version: '20.x'
          cache: npm

      # `npm ci` rather than `npm install`: it installs exactly what the
      # lockfile pins and fails when package.json and package-lock.json
      # disagree. `install` may resolve newer versions on its own, and then CI
      # stops testing the same tree you have locally.
      - name: Install dependencies
        run: npm ci

      # `tsc -b`, not `tsc --noEmit`: this repo's root tsconfig.json is
      # solution-style ("files": [] plus references), so --noEmit type-checks
      # nothing and always passes.
      - name: Type-check
        run: npx tsc -b

  test:
    name: Test
    # Only starts once `typecheck` succeeded. Without this line all three jobs
    # would run in parallel and you would watch the tests fail because of a
    # type error.
    needs: typecheck
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20.x'
          cache: npm

      - name: Install dependencies
        run: npm ci

      # `npm test` is `vitest run`: a single pass that exits. Without `run`,
      # Vitest stays in watch mode and the job hangs until it times out.
      - name: Run tests
        run: npm test

  build:
    name: Build
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20.x'
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build

      # Keeps the build output downloadable from the run page. This deploys
      # nothing: it just puts the bundle within reach for inspection, and is
      # the natural hook for a deploy job later. Safe to drop.
      - name: Upload build output
        uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/
          retention-days: 7
